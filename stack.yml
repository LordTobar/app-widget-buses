# Stack Portainer desplegado: RedTransporteAPI (compilado en la Pi; imagen oficial es solo amd64)
# Variable del stack (Portainer > Environment variables):
#   MASTER_TOKEN = token largo aleatorio (ver .env.example)
services:
  api:
    build:
      context: https://github.com/iiroak/RedTransporteAPI.git#main
    image: redtransporte-api:local
    container_name: redtransporte-api
    environment:
      RED_TRANSPORTE_DATA_DIR: /data
      RED_TRANSPORTE_PUBLIC_API: "false"
      RED_TRANSPORTE_MASTER_TOKEN: ${MASTER_TOKEN}
      RED_TRANSPORTE_TRUST_PROXY: "false"
    volumes:
      - red_transporte_data:/data
    ports:
      - "8090:8000" # 8080 estaba ocupado
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s # primer arranque descarga ~150 MB de GTFS

volumes:
  red_transporte_data:
